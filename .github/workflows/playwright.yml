name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allows manual runs from the Actions tab

# Needed so the deploy job can publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two Pages deployments running/racing at the same time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        # Report is still generated even if tests fail, so don't let this
        # step short-circuit the workflow before we upload it below.
        continue-on-error: true
        id: run_tests

      # The default Playwright config outputs the HTML report to
      # "playwright-report/". Adjust the path below if yours differs.
      - name: Upload report artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Fail workflow if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  deploy:
    name: Deploy report to GitHub Pages
    needs: test
    if: always() # deploy the report whether tests passed or failed
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
