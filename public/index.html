<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <main class="login-card" data-testid="login-page">
    <h1 class="login-card__title">TaskFlow</h1>
    <p class="login-card__subtitle">Sign in to manage your tasks</p>

    <form id="login-form" data-testid="login-form" novalidate>
      <label class="field">
        <span class="field__label">Username</span>
        <input
          type="text"
          id="username"
          name="username"
          data-testid="username-input"
          autocomplete="username"
          required
        />
      </label>

      <label class="field">
        <span class="field__label">Password</span>
        <input
          type="password"
          id="password"
          name="password"
          data-testid="password-input"
          autocomplete="current-password"
          required
        />
      </label>

      <p id="login-error" class="error-text" data-testid="login-error" role="alert" hidden></p>

      <button type="submit" id="login-submit" data-testid="login-submit-btn">Log in</button>
    </form>

    <p class="login-card__hint" data-testid="login-hint">
      Demo credentials: <code>admin</code> / <code>password123</code>
    </p>
  </main>

  <script src="app.js"></script>
  <script>
    initLoginPage();
  </script>
</body>
</html>
